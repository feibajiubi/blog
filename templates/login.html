<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'bootstrap-3.4.1-dist\css\bootstrap.min.css' %}">
    <script src="{% static 'js\jquery-3.7.1.min.js' %}"></script>
    <script src="{% static 'bootstrap-3.4.1-dist\js\bootstrap.min.js' %}"></script>
</head>
<body>
<div class="container-fluid">
    <div class="col-md-4 col-md-offset-4">
        <h1>登录</h1>
        <div class="form-group">
            <label for="username">用户名</label>
            <input type="text" name="username" id="username" class="form-control">
        </div>
        <div class="form-group">
            <label for="password">密码</label>
            <input type="text" name="password" id="password" class="form-control">
        </div>
        <div class="form-group">
            <label for="code">验证码</label>
            <div class="row">
                <div class="col-md-3">
                    <input type="text" name="code" id="code" class="form-control">
                </div>
                <div class="col-md-3">
                    <img src="/get_code/" alt="" width="400px" height="35px" id="img">
                </div>
            </div>
            <p>没有账户,<a href="/register/">立即注册</a></p>
            <input type="button" class="btn btn-primary pull-right" value="登录" id="commit">
            <span class="'pull-right" style="color:#ff0000" id="msg"></span>
        </div>
    </div>

</div>
</body>
<script>
    $('#img').click(function () {
        //先获取标签之前的src的值，然后加？进行刷新
        let oldVal= $(this).attr('src')
        $(this).attr('src',oldVal+='?')
    })
    $('#commit').click(function () {
        $.ajax({
            url:'',
            type:'post',
            data:{
                'username':$('#username').val(),
                'password':$('#password').val(),
                'code':$('#code').val(),
                csrfmiddlewaretoken:'{{ csrf_token }}'
            },
            success:function (args) {
                if(args.code===0){
                    window.location.href=args.url
                }else{
                    $('#msg').text(args.msg)
                    // 登录失败后自动刷新验证码
                    $('#img').attr('src','/get_code/?'+Math.random())
                    // 清空验证码输入框
                    $('#code').val('')
                }
            }
        })

    })
</script>
</html>
